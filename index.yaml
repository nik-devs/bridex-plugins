# Bridex plugin registry.
#
# An instance fetches ONLY this file: the catalog, versions and update checks
# all come from here — plugin repositories are cloned only at install time,
# always at the pinned commit below.
version: 1
plugins:
  - name: hello
    title: Hello (demo)
    kind: tool
    description: Hello-world plugin — smoke-tests the catalog pipeline (install, update, removal)
    version: 0.1.0
    repo: https://github.com/nik-devs/bridex-plugin-hello
    ref: main
    commit: 5c29482ea645b4a21410dd2ad0d446490f7f7cbb
    permissions:
      network: false
      llm: false
  - name: semantic-cache-local
    title: Semantic cache (local)
    kind: tool
    description: Local semantic answer cache for support/FAQ agents — instant repeat answers, zero external services (word+trigram matching, jailed, no network)
    version: 0.1.0
    repo: https://github.com/nik-devs/bridex-plugin-semantic-cache-local
    ref: main
    commit: 2607fa38ac7cc742b0e8566643979228822c2246
    permissions:
      network: false
      llm: false
  - name: semantic-cache-langcache
    title: Semantic cache (LangCache)
    kind: tool
    description: Redis LangCache provider for the semantic answer cache — managed embedding-level matching on Redis Cloud
    version: 0.1.0
    repo: https://github.com/nik-devs/bridex-plugin-semantic-cache-langcache
    ref: main
    commit: cc6e14d713505b75ce45cb0abf4ba91892cdb0eb
    permissions:
      network: true
      llm: false
  - name: runners-gate
    title: Cloud Run runners
    kind: integration
    description: Gate to Cloud Run Jobs workers — submit heavy ops (render, convert, batch), the worker calls back and the requesting agent wakes in its session; multiple runners route by op name. GCP-resident (metadata auth).
    version: 0.5.0
    repo: https://github.com/nik-devs/bridex-plugin-runners-gate
    ref: main
    commit: 5282bb0b6843285ee40b8d8050a0929463e254ec
    permissions:
      network: true
      llm: false
  - name: fal
    title: fal.ai
    kind: integration
    description: Any fal.ai model for agents — video, image, audio. Outputs land in the task's artifacts with a cost estimate.
    version: 0.2.3
    repo: https://github.com/nik-devs/bridex-plugin-fal
    ref: main
    commit: 28e927736b5bf2d44cdfe1baceeb58991e79f08e
    permissions:
      network: true
      llm: false
  - name: e2b-blender
    title: Blender (E2B)
    kind: integration
    description: Blender for agents in an isolated cloud sandbox (E2B) — Python in a live scene or from skill scripts, long renders run in the background and wake the agent, previews, files in and out of artifacts.
    agent_notes: The first call on an E2B account builds its sandbox template there — a few minutes, once; later calls start in seconds.
    version: 0.2.0
    repo: https://github.com/nik-devs/bridex-plugin-e2b-blender
    ref: main
    commit: 0526daedf0f3ff04599e5901fc84b596365a40bc
    permissions:
      network: true
      llm: false
  - name: elevenlabs
    title: ElevenLabs
    kind: integration
    description: ElevenLabs for agents — voiceover in any voice (own or the shared library) with word timings and ready subtitles, and sound effects. Outputs land in the task's artifacts.
    agent_notes: Its key is ELEVENLABS_API_KEY — not the voice assistant's ELEVENLABS_PERSONA_KEY; do not reuse or ask for that one.
    version: 0.2.0
    repo: https://github.com/nik-devs/bridex-plugin-elevenlabs
    ref: main
    commit: 61303bc89bf96ea252ef11e6a242b6cd15032053
    permissions:
      network: true
      llm: false
