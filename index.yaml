# Bridex plugin registry.
#
# An instance fetches ONLY this file: the catalog, versions and update checks
# all come from here — plugin repositories are cloned only at install time,
# always at the pinned commit below.
version: 1
plugins:
  - name: hello
    title: Hello (demo)
    kind: tool
    description: A test plugin to check that installing works.
    version: 0.1.0
    repo: https://github.com/nik-devs/bridex-plugin-hello
    ref: main
    commit: 5c29482ea645b4a21410dd2ad0d446490f7f7cbb
    permissions:
      network: false
      llm: false
  - name: semantic-cache-local
    title: Semantic cache (local)
    kind: tool
    description: Answers repeat questions at once, without spending tokens. Runs on this server.
    agent_notes: Word and trigram matching, no network. Holds the instance semantic-cache slot; switch it on per agent with capabilities.semantic_cache — for support/FAQ agents only.
    version: 0.1.0
    repo: https://github.com/nik-devs/bridex-plugin-semantic-cache-local
    ref: main
    commit: 2607fa38ac7cc742b0e8566643979228822c2246
    permissions:
      network: false
      llm: false
  - name: semantic-cache-langcache
    title: Semantic cache (LangCache)
    kind: tool
    description: Answers repeat questions at once, without spending tokens. Runs on Redis Cloud.
    agent_notes: Embedding-level matching on Redis LangCache (keys LANGCACHE_URL, LANGCACHE_CACHE_ID, LANGCACHE_API_KEY). Holds the semantic-cache slot; per agent via capabilities.semantic_cache.
    version: 0.1.0
    repo: https://github.com/nik-devs/bridex-plugin-semantic-cache-langcache
    ref: main
    commit: cc6e14d713505b75ce45cb0abf4ba91892cdb0eb
    permissions:
      network: true
      llm: false
  - name: runners-gate
    title: Cloud Run runners
    kind: integration
    description: Sends heavy jobs like renders to Google Cloud and wakes the agent when they finish.
    agent_notes: Cloud Run Jobs workers routed by op name; the worker calls back and the agent wakes in its session. GCP-resident (metadata auth).
    version: 0.6.2
    repo: https://github.com/nik-devs/bridex-plugin-runners-gate
    ref: main
    commit: a936fd7a43dfbfce63c52c5c6ed968fb7ae3f46d
    permissions:
      network: true
      llm: false
  - name: fal
    title: fal.ai
    kind: integration
    description: Any fal.ai model for images, video and audio.
    agent_notes: Outputs land in the task artifacts with a cost estimate. Read fal_schema before a paid fal_run.
    version: 0.3.0
    repo: https://github.com/nik-devs/bridex-plugin-fal
    ref: main
    commit: 8af0157d97feec477fcd1afbac9e0eea69947eb1
    permissions:
      network: true
      llm: false
  - name: e2b-blender
    title: Blender (E2B)
    kind: integration
    description: Agents build and render 3D scenes in Blender, in the cloud.
    agent_notes: The first call on an E2B account builds its sandbox template there — a few minutes, once; later calls start in seconds.
    version: 0.2.5
    repo: https://github.com/nik-devs/bridex-plugin-e2b-blender
    ref: main
    commit: 34399012334d33897588b5a1f9c7346b7dd5533e
    permissions:
      network: true
      llm: false
  - name: brightdata
    title: Bright Data
    kind: integration
    description: Opens sites that block bots for web_fetch and the browser, searches Google/Bing, an interactive remote browser and proxies — on your Bright Data account.
    agent_notes: web_fetch and browser_navigate already go through it on a bot wall; its own tools (brightdata_balance, brightdata_zones, brightdata_scrape, brightdata_search) steer it. Key BRIGHTDATA_API_KEY. Paid per request / traffic, capped by a daily budget.
    version: 0.1.0
    repo: https://github.com/nik-devs/bridex-plugin-brightdata
    ref: main
    commit: 2cca4cced18e30c75aecc5c88d2bc41591d5ac13
    permissions:
      network: true
      llm: false
  - name: elevenlabs
    title: ElevenLabs
    kind: integration
    description: Voiceover in any voice, with subtitles, sound effects and music.
    agent_notes: Its key is ELEVENLABS_API_KEY — not the voice assistant's ELEVENLABS_PERSONA_KEY; do not reuse or ask for that one.
    version: 0.4.1
    repo: https://github.com/nik-devs/bridex-plugin-elevenlabs
    ref: main
    commit: 3584a36c1c179784e9b8767a369f238f5290cae4
    permissions:
      network: true
      llm: false
  - name: railway
    title: Railway
    kind: integration
    description: Agents deploy and run services on Railway — projects, databases, deploys, logs, variables, domains.
    agent_notes: Needs an account or workspace token, not a project token. Agents never see it — every call runs the bundled CLI with it inside the plugin.
    version: 0.1.1
    repo: https://github.com/nik-devs/bridex-plugin-railway
    ref: main
    commit: 677ae63d0bc00cc7997ba28539d949d8e4259e9c
    permissions:
      network: true
      llm: false
  - name: loremax
    title: LoreMax
    kind: integration
    description: LoreMax workflows for agents — images, video, audio, 3D and text, from the whole organization or a curated MCP profile; outputs land in the task's artifacts with provenance and token spend.
    agent_notes: "Read loremax_workflows first (free) for a workflow's fields and token price; loremax_generate is paid and saves outputs into the task artifacts with provenance; a run that outlives the wait returns a generation_id and the agent is woken when it lands (or loremax_result). loremax_upload is free: import workspace files or public HTTPS links, including Bridex file_publish URLs, and use the returned URLs in the workflow's exact named inputs. It uses the managed key; do not ask users to upload manually or share a key. Follow reference_usage from workflow details; REST references are local multipart files, not named slots. Needs LOREMAX_API_KEY only (LoreMax's address defaults to https://loremax.ai; base_url or the instance's LOREMAX_BASE_URL override it); optional profile_url switches the tools to a curated LoreMax MCP profile. A `submitting` reply means the paid call is still landing: end the turn, you will be woken — never call again; one with `duplicate_of` means this exact request is already being submitted. base_url and profile_url must be https://, base_url the address alone (no path). Start from `recommended` in the loremax_workflows list (the best live workflow per task) and follow its `rules`; a workflow's details carry `guide` (use_for, knobs, caveats). In profile mode the studio's `instructions` and each tool's own description take precedence over the guide. With allow_profile_edit on, loremax_profile_edit rewrites the profile's texts in LoreMax for every client of the profile: preview first, then apply: true."
    version: 0.5.0
    repo: https://github.com/echeg/bridex-plugin-loremax
    ref: main
    commit: f901ba27ac4be0a8cb69053a5831f13717cf628d
    permissions:
      network: true
      llm: false
