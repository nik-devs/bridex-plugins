# Bridex plugin registry.
#
# An instance fetches ONLY this file: the catalog, versions and update checks
# all come from here — plugin repositories are cloned only at install time,
# always at the pinned commit below.
version: 1
plugins:
  - name: hello
    title: Hello (demo)
    kind: tool
    description: A test plugin to check that installing works.
    version: 0.1.0
    repo: https://github.com/nik-devs/bridex-plugin-hello
    ref: main
    commit: 5c29482ea645b4a21410dd2ad0d446490f7f7cbb
    permissions:
      network: false
      llm: false
  - name: semantic-cache-local
    title: Semantic cache (local)
    kind: tool
    description: Answers repeat questions at once, without spending tokens. Runs on this server.
    agent_notes: Word and trigram matching, no network. Holds the instance semantic-cache slot; switch it on per agent with capabilities.semantic_cache — for support/FAQ agents only.
    version: 0.1.0
    repo: https://github.com/nik-devs/bridex-plugin-semantic-cache-local
    ref: main
    commit: 2607fa38ac7cc742b0e8566643979228822c2246
    permissions:
      network: false
      llm: false
  - name: semantic-cache-langcache
    title: Semantic cache (LangCache)
    kind: tool
    description: Answers repeat questions at once, without spending tokens. Runs on Redis Cloud.
    agent_notes: Embedding-level matching on Redis LangCache (keys LANGCACHE_URL, LANGCACHE_CACHE_ID, LANGCACHE_API_KEY). Holds the semantic-cache slot; per agent via capabilities.semantic_cache.
    version: 0.1.0
    repo: https://github.com/nik-devs/bridex-plugin-semantic-cache-langcache
    ref: main
    commit: cc6e14d713505b75ce45cb0abf4ba91892cdb0eb
    permissions:
      network: true
      llm: false
  - name: runners-gate
    title: Cloud Run runners
    kind: integration
    description: Sends heavy jobs like renders to Google Cloud and wakes the agent when they finish.
    agent_notes: Cloud Run Jobs workers routed by op name; the worker calls back and the agent wakes in its session. GCP-resident (metadata auth).
    version: 0.6.2
    repo: https://github.com/nik-devs/bridex-plugin-runners-gate
    ref: main
    commit: a936fd7a43dfbfce63c52c5c6ed968fb7ae3f46d
    permissions:
      network: true
      llm: false
  - name: fal
    title: fal.ai
    kind: integration
    description: Any fal.ai model for images, video and audio.
    agent_notes: Outputs land in the task artifacts with a cost estimate. Read fal_schema before a paid fal_run. To cut a subject out of an existing image (transparent PNG, clean hair and fur edges), fal_run fal-ai/birefnet/v2 — not a local model.
    # what it does through its API that agents would otherwise run as a local model:
    # the core names it, with the how, when an agent reaches for one (runtime/localModelGuard.ts)
    provides:
      background-removal: fal_run fal-ai/birefnet/v2 (images), fal-ai/birefnet/v2/video (video)
      upscaling: fal_run fal-ai/seedvr/upscale/image; video — fal-ai/bytedance-upscaler/upscale/video
      vision-models: fal_run fal-ai/sam-3/image (masks), fal-ai/florence-2-large/object-detection (boxes), fal-ai/image-preprocessors/depth-anything/v2 (depth), fal-ai/dwpose (pose)
      speech-to-text: fal_run fal-ai/wizper (Whisper)
      text-to-speech: fal_models category text-to-speech
      voice-cloning: fal_run fal-ai/minimax/voice-clone
      audio-separation: fal_run fal-ai/demucs (stems), fal-ai/deepfilternet3 (noise)
      music: fal_models category text-to-audio
      ocr: fal_run fal-ai/got-ocr/v2, fal-ai/florence-2-large/ocr
      image-generation: fal_models category text-to-image / image-to-image
      lip-sync: fal_run fal-ai/sync-lipsync/v3
      3d: fal_run fal-ai/trellis-2, fal-ai/hunyuan-3d/v3.1/pro/image-to-3d
    version: 0.3.0
    repo: https://github.com/nik-devs/bridex-plugin-fal
    ref: main
    commit: 8af0157d97feec477fcd1afbac9e0eea69947eb1
    permissions:
      network: true
      llm: false
  - name: e2b-blender
    title: Blender (E2B)
    kind: integration
    description: Agents build and render 3D scenes in Blender, in the cloud.
    agent_notes: The first call on an E2B account builds its sandbox template there — a few minutes, once; later calls start in seconds.
    version: 0.2.6
    repo: https://github.com/nik-devs/bridex-plugin-e2b-blender
    ref: main
    commit: d151d0405eccc35bf68a589a0aee9910f3dd05a5
    permissions:
      network: true
      llm: false
  - name: brightdata
    title: Bright Data
    kind: integration
    description: Opens sites that block bots for web_fetch and the browser, searches Google/Bing, an interactive remote browser and proxies — on your Bright Data account.
    agent_notes: web_fetch and browser_navigate already go through it on a bot wall; its own tools (brightdata_balance, brightdata_zones, brightdata_scrape, brightdata_search) steer it. Key BRIGHTDATA_API_KEY. Paid per request / traffic, capped by a daily budget.
    version: 0.1.0
    repo: https://github.com/nik-devs/bridex-plugin-brightdata
    ref: main
    commit: 2cca4cced18e30c75aecc5c88d2bc41591d5ac13
    permissions:
      network: true
      llm: false
  - name: elevenlabs
    title: ElevenLabs
    kind: integration
    description: Voiceover in any voice, with subtitles, sound effects and music.
    agent_notes: Its key is ELEVENLABS_API_KEY — not the voice assistant's ELEVENLABS_PERSONA_KEY; do not reuse or ask for that one. eleven_transcribe turns speech into text with speakers and an .srt; eleven_api / eleven_run reach the rest of the API (voice isolation, forced alignment, voice changer and cloning, dialogue, dubbing, stems).
    provides:
      speech-to-text: eleven_transcribe (Scribe — speakers, word timings, .srt)
      text-to-speech: eleven_speak
      voice-cloning: eleven_run POST /v1/voices/add (clone from samples), POST /v1/voice-changer/{voice_id} (speech to speech), POST /v1/text-to-voice/design
      audio-separation: eleven_run POST /v1/audio-isolation (a voice out of noise), POST /v1/music/stem-separation (stems)
      music: eleven_music; sound effects — eleven_sfx
    version: 0.5.0
    repo: https://github.com/nik-devs/bridex-plugin-elevenlabs
    ref: main
    commit: d748a2d3e50d66d924d7c784d9a81d37571ecad3
    permissions:
      network: true
      llm: false
  - name: railway
    title: Railway
    kind: integration
    description: Agents deploy and run services on Railway — projects, databases, deploys, logs, variables, domains.
    agent_notes: The key is RAILWAY_API_TOKEN in Settings → Integrations → Railway — an account or workspace token, not a project token. Agents never see it — every call runs the bundled CLI with it inside the plugin.
    version: 0.2.0
    repo: https://github.com/nik-devs/bridex-plugin-railway
    ref: main
    commit: 159be88bb328ef667d16f5e7a7cc09084110d5fe
    permissions:
      network: true
      llm: false
  - name: tripo
    title: Tripo 3D
    kind: integration
    description: Agents make 3D models with Tripo — from text, an image or several views — then texture, rig, animate, retopologize and convert them.
    provides:
      3d: tripo_run (text, an image or several views → a model; rig, animate, convert)
    agent_notes: Needs TRIPO_API_KEY (developers.tripo3d.ai → API Keys). API credits are bought there; a Tripo Studio subscription does not pay for API calls. Outputs are saved into the task's artifacts at once — Tripo's links expire after five minutes.
    version: 0.1.1
    repo: https://github.com/nik-devs/bridex-plugin-tripo
    ref: main
    commit: fea1215355d46709628e31cea4c02f95fc7e6de9
    permissions:
      network: true
      llm: false
  - name: video-editing
    title: Video editing
    kind: integration
    description: Agents edit video — reels, captions, titles, transitions, music — as HTML/CSS/GSAP compositions rendered to MP4, with fast libass captions, any font and reference analysis.
    agent_notes: HyperFrames projects for designed video (video_new, video_hf with check, snapshot, compare, catalog and add — 448 blocks — measure and beats, video_render in the background); video_captions burns plain speech captions in one ffmpeg pass; video_fonts adds any font and checks glyph coverage; video_fetch takes a reference by its link; video_setup installs the official HyperFrames skills. Transcripts, voices and cut-outs come from the APIs, not from local models.
    version: 0.1.2
    repo: https://github.com/nik-devs/bridex-plugin-video-editing
    ref: main
    commit: 3ab1984d02e976a36fd7dc41b708847281feec61
    permissions:
      network: true
      llm: false
